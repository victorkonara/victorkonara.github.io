{%- comment -%}
  Include as: {% include components/book-buy-links.html links=book.links.uk class="ed-buy ed-uk" %}
  Renders one edition's retailer buttons from a list of {label, url} pairs.
{%- endcomment -%}
<div class="book-buy-links {{ include.class }}">
{%- for link in include.links -%}
<a href="{{ link.url }}" class="btn-book{% if forloop.first %} btn-book-primary{% endif %}">{{ link.label }}</a>
{%- endfor -%}
</div>
